<html lang="zh-CN">

    <title>人工智能学院教学知识库</title>

      (function () {
        if (localStorage.getItem('app_theme') === 'dark') {
          document.documentElement.classList.add('dark')

      })()

      html, body, #app { margin: 0; padding: 0; min-height: 100%; background: #F1F5F9; }
      html.dark, html.dark body, html.dark #app { background: #0F172A; }
    </style>
  </head>

    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
