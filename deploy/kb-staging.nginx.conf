# ============================================================
# staging nginx 配置（8080 端口，独立反代到后端 8002）
# 用法：
#   sudo cp deploy/kb-staging.nginx.conf /etc/nginx/sites-available/kb-staging
#   sudo ln -s /etc/nginx/sites-available/kb-staging /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# 注意：staging 与生产站点（80 端口）的静态文件目录、后端端口完全隔离。
# ============================================================
server {
    listen 8080;
    server_name _;

    root /opt/kb-staging/frontend/dist;
    index index.html;
    client_max_body_size 50m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location /static/ {
        proxy_pass http://127.0.0.1:8002;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
